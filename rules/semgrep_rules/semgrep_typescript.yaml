rules:
- id: angular-bypasssecuritytrust
  message: Detected the use of `$TRUST`. This can introduce a Cross-Site-Scripting
    (XSS) vulnerability if this comes from user-provided input. If you have to use
    `$TRUST`, ensure it does not come from user-input or use the appropriate prevention
    mechanism e.g. input validation or sanitization depending on the context.
  metadata:
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site
      Scripting'')'
    references:
    - https://angular.io/api/platform-browser/DomSanitizer
    - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
    owasp:
    - A07:2017 - Cross-Site Scripting (XSS)
    - A03:2021 - Injection
    - A05:2025 - Injection
    confidence: MEDIUM
    category: security
    technology:
    - angular
    - browser
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: LOW
    impact: MEDIUM
  languages:
  - typescript
  severity: WARNING
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern-inside: 'function ...({..., $X: string, ...}) { ... }

          '
      - pattern-inside: 'function ...(..., $X: string, ...) { ... }

          '
    - focus-metavariable: $X
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $X.$TRUST($Y)
    - focus-metavariable: $Y
    - pattern-not: '$X.$TRUST(`...`)

        '
    - pattern-not: '$X.$TRUST("...")

        '
    - metavariable-regex:
        metavariable: $TRUST
        regex: (bypassSecurityTrustHtml|bypassSecurityTrustStyle|bypassSecurityTrustScript|bypassSecurityTrustUrl|bypassSecurityTrustResourceUrl)
  pattern-sanitizers:
  - patterns:
    - pattern-either:
      - pattern-inside: 'import $S from "underscore.string"

          ...

          '
      - pattern-inside: 'import * as $S from "underscore.string"

          ...

          '
      - pattern-inside: 'import $S from "underscore.string"

          ...

          '
      - pattern-inside: '$S = require("underscore.string")

          ...

          '
    - pattern-either:
      - pattern: $S.escapeHTML(...)
  - patterns:
    - pattern-either:
      - pattern-inside: 'import $S from "dompurify"

          ...

          '
      - pattern-inside: 'import { ..., $S,... } from "dompurify"

          ...

          '
      - pattern-inside: 'import * as $S from "dompurify"

          ...

          '
      - pattern-inside: '$S = require("dompurify")

          ...

          '
      - pattern-inside: 'import $S from "isomorphic-dompurify"

          ...

          '
      - pattern-inside: 'import * as $S from "isomorphic-dompurify"

          ...

          '
      - pattern-inside: '$S = require("isomorphic-dompurify")

          ...

          '
    - pattern-either:
      - patterns:
        - pattern-inside: '$VALUE = $S(...)

            ...

            '
        - pattern: $VALUE.sanitize(...)
      - patterns:
        - pattern-inside: '$VALUE = $S.sanitize

            ...

            '
        - pattern: $S(...)
      - pattern: $S.sanitize(...)
      - pattern: $S(...)
  - patterns:
    - pattern-either:
      - pattern-inside: 'import $S from ''xss'';

          ...

          '
      - pattern-inside: 'import * as $S from ''xss'';

          ...

          '
      - pattern-inside: '$S = require("xss")

          ...

          '
    - pattern: $S(...)
  - patterns:
    - pattern-either:
      - pattern-inside: 'import $S from ''sanitize-html'';

          ...

          '
      - pattern-inside: 'import * as $S from "sanitize-html";

          ...

          '
      - pattern-inside: '$S = require("sanitize-html")

          ...

          '
    - pattern: $S(...)
  - patterns:
    - pattern: sanitizer.sanitize(...)
    - pattern-not: sanitizer.sanitize(SecurityContext.NONE, ...);
- id: awscdk-bucket-grantpublicaccessmethod
  message: Using the GrantPublicAccess method on bucket contruct $X will make the
    objects in the bucket world accessible. Verify if this is intentional.
  metadata:
    cwe:
    - 'CWE-306: Missing Authentication for Critical Function'
    category: security
    technology:
    - AWS-CDK
    references:
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-overview.html
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: HIGH
    impact: HIGH
    confidence: MEDIUM
  languages:
  - ts
  severity: WARNING
  pattern-either:
  - patterns:
    - pattern-inside: 'import {Bucket} from ''@aws-cdk/aws-s3''

        ...

        '
    - pattern: 'const $X = new Bucket(...)

        ...

        $X.grantPublicAccess(...)

        '
  - patterns:
    - pattern-inside: 'import * as $Y from ''@aws-cdk/aws-s3''

        ...

        '
    - pattern: 'const $X = new $Y.Bucket(...)

        ...

        $X.grantPublicAccess(...)

        '
- id: awscdk-codebuild-project-public
  message: CodeBuild Project $X is set to have a public URL. This will make the build
    results, logs, artifacts publically accessible, including builds prior to the
    project being public. Ensure this is acceptable for the project.
  metadata:
    category: security
    cwe:
    - 'CWE-306: Missing Authentication for Critical Function'
    technology:
    - AWS-CDK
    references:
    - https://docs.aws.amazon.com/codebuild/latest/userguide/public-builds.html
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
  languages:
  - ts
  severity: WARNING
  pattern-either:
  - patterns:
    - pattern-inside: 'import {Project} from ''@aws-cdk/aws-codebuild''

        ...

        '
    - pattern: 'const $X = new Project(..., {..., badge: true, ...})

        '
  - patterns:
    - pattern-inside: 'import * as $Y from ''@aws-cdk/aws-codebuild''

        ...

        '
    - pattern: 'const $X = new $Y.Project(..., {..., badge: true, ...})

        '
- id: awscdk-bucket-encryption
  message: 'Add "encryption: $Y.BucketEncryption.KMS_MANAGED" or "encryption: $Y.BucketEncryption.S3_MANAGED"
    to the bucket props for Bucket construct $X'
  metadata:
    cwe:
    - 'CWE-311: Missing Encryption of Sensitive Data'
    category: security
    technology:
    - AWS-CDK
    references:
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/security-best-practices.html
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A04:2021 - Insecure Design
    - A06:2025 - Insecure Design
    subcategory:
    - vuln
    likelihood: LOW
    impact: HIGH
    confidence: MEDIUM
  languages:
  - typescript
  severity: ERROR
  pattern-either:
  - patterns:
    - pattern-inside: 'import {Bucket} from ''@aws-cdk/aws-s3''

        ...

        '
    - pattern: const $X = new Bucket(...)
    - pattern-not: 'const $X = new Bucket(..., {..., encryption: BucketEncryption.KMS_MANAGED,
        ...})

        '
    - pattern-not: 'const $X = new Bucket(..., {..., encryption: BucketEncryption.KMS,
        ...})

        '
    - pattern-not: 'const $X = new Bucket(..., {..., encryption: BucketEncryption.S3_MANAGED,
        ...})

        '
  - patterns:
    - pattern-inside: 'import * as $Y from ''@aws-cdk/aws-s3''

        ...

        '
    - pattern: const $X = new $Y.Bucket(...)
    - pattern-not: 'const $X = new $Y.Bucket(..., {..., encryption: $Y.BucketEncryption.KMS_MANAGED,
        ...})

        '
    - pattern-not: 'const $X = new $Y.Bucket(..., {..., encryption: $Y.BucketEncryption.KMS,
        ...})

        '
    - pattern-not: 'const $X = new $Y.Bucket(..., {..., encryption: $Y.BucketEncryption.S3_MANAGED,
        ...})

        '
- id: aws-cdk-bucket-enforcessl
  message: Bucket $X is not set to enforce encryption-in-transit, if not explictly
    setting this on the bucket policy - the property "enforceSSL" should be set to
    true
  metadata:
    cwe:
    - 'CWE-319: Cleartext Transmission of Sensitive Information'
    category: security
    technology:
    - AWS-CDK
    references:
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/security-best-practices.html
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A02:2021 - Cryptographic Failures
    - A04:2025 - Cryptographic Failures
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
  languages:
  - ts
  severity: ERROR
  pattern-either:
  - patterns:
    - pattern-inside: 'import {Bucket} from ''@aws-cdk/aws-s3'';

        ...

        '
    - pattern: const $X = new Bucket(...)
    - pattern-not: 'const $X = new Bucket(..., {enforceSSL: true}, ...)

        '
  - patterns:
    - pattern-inside: 'import * as $Y from ''@aws-cdk/aws-s3'';

        ...

        '
    - pattern: const $X = new $Y.Bucket(...)
    - pattern-not: 'const $X = new $Y.Bucket(..., {..., enforceSSL: true, ...})

        '
- id: awscdk-sqs-unencryptedqueue
  message: 'Queue $X is missing encryption at rest. Add "encryption: $Y.QueueEncryption.KMS"
    or "encryption: $Y.QueueEncryption.KMS_MANAGED" to the queue props to enable encryption
    at rest for the queue.'
  metadata:
    category: security
    cwe:
    - 'CWE-311: Missing Encryption of Sensitive Data'
    technology:
    - AWS-CDK
    references:
    - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-data-protection.html
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A04:2021 - Insecure Design
    - A06:2025 - Insecure Design
    subcategory:
    - vuln
    likelihood: LOW
    impact: HIGH
    confidence: MEDIUM
  languages:
  - ts
  severity: WARNING
  pattern-either:
  - patterns:
    - pattern-inside: 'import {Queue} from ''@aws-cdk/aws-sqs''

        ...

        '
    - pattern: const $X = new Queue(...)
    - pattern-not: 'const $X = new Queue(..., {..., encryption: QueueEncryption.KMS_MANAGED,
        ...})

        '
    - pattern-not: 'const $X = new Queue(..., {..., encryption: QueueEncryption.KMS,
        ...})

        '
  - patterns:
    - pattern-inside: 'import * as $Y from ''@aws-cdk/aws-sqs''

        ...

        '
    - pattern: const $X = new $Y.Queue(...)
    - pattern-not: 'const $X = new $Y.Queue(..., {..., encryption: $Y.QueueEncryption.KMS_MANAGED,
        ...})

        '
    - pattern-not: 'const $X = new $Y.Queue(..., {..., encryption: $Y.QueueEncryption.KMS,
        ...})

        '
- id: moment-deprecated
  pattern: 'import ''moment''

    '
  message: Moment is a legacy project in maintenance mode. Consider using libraries
    that are actively supported, e.g. `dayjs`.
  languages:
  - typescript
  - javascript
  severity: INFO
  metadata:
    category: best-practice
    technology:
    - moment
    - dayjs
    references:
    - https://momentjs.com/docs/#/-project-status/
    - https://day.js.org/
- id: useless-ternary
  pattern: '$CONDITION ? $ANS : $ANS

    '
  message: It looks like no matter how $CONDITION is evaluated, this expression returns
    $ANS. This is probably a copy-paste error.
  languages:
  - typescript
  - javascript
  metadata:
    category: correctness
    technology:
    - react
  severity: ERROR
- id: cors-regex-wildcard
  message: 'Unescaped ''.'' character in CORS domain regex $CORS: $PATTERN'
  metadata:
    cwe:
    - 'CWE-183: Permissive List of Allowed Inputs'
    category: security
    technology:
    - cors
    owasp:
    - A04:2021 - Insecure Design
    - A06:2025 - Insecure Design
    references:
    - https://owasp.org/Top10/A04_2021-Insecure_Design
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    confidence: LOW
  languages:
  - ts
  severity: WARNING
  patterns:
  - pattern-either:
    - pattern: $CORS = [...,/$PATTERN/,...]
    - pattern: $CORS = /$PATTERN/
  - focus-metavariable: $PATTERN
  - metavariable-regex:
      metavariable: $PATTERN
      regex: .+?(?<!\\).\..+(?<!\\)\..+
  - metavariable-regex:
      metavariable: $CORS
      regex: (?i)cors
- id: nestjs-header-cors-any
  message: Access-Control-Allow-Origin response header is set to "*". This will disable
    CORS Same Origin Policy restrictions.
  metadata:
    cwe:
    - 'CWE-183: Permissive List of Allowed Inputs'
    asvs:
      section: 'V14: Configuration Verification Requirements'
      control_id: 14.4.8 Permissive CORS
      control_url: https://github.com/OWASP/ASVS/blob/master/4.0/en/0x22-V14-Config.md#v144-http-security-headers-requirements
      version: '4'
    category: security
    technology:
    - nestjs
    owasp:
    - A04:2021 - Insecure Design
    - A06:2025 - Insecure Design
    references:
    - https://owasp.org/Top10/A04_2021-Insecure_Design
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    confidence: LOW
  languages:
  - typescript
  severity: WARNING
  pattern-either:
  - pattern: "class $CN {\n    @Header(\"=~/[Aa][Cc][Cc][Ee][Ss][Ss]-[Cc][Oo][Nn][Tt][Rr][Oo][Ll]-[Aa][Ll][Ll][Oo][Ww]-[Oo][Rr][Ii][Gg][Ii][Nn]/\"\
      , '*')\n    $FN(...) {\n        ...\n    }\n}\n"
  - pattern: 'NestFactory.create($MODULE, {cors: true})

      '
  - pattern: 'NestFactory.create($MODULE, {cors: {origin: ''*''}})

      '
  - pattern: '$APP.enableCors()

      '
  - pattern: '$APP.enableCors({origin: ''*''})

      '
- id: nestjs-header-xss-disabled
  message: X-XSS-Protection header is set to 0. This will disable the browser's XSS
    Filter.
  metadata:
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site
      Scripting'')'
    category: security
    technology:
    - nestjs
    owasp:
    - A07:2017 - Cross-Site Scripting (XSS)
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    confidence: LOW
  languages:
  - typescript
  severity: WARNING
  pattern: "class $CN {\n    ...\n    @Header(\"=~/[Xx]-[Xx][Ss][Ss]-[Pp][Rr][Oo][Tt][Ee][Cc][Tt][Ii][Oo][Nn]/\"\
    , '0')\n    $FN(...) {\n        ...\n    }\n    ...\n}\n"
- id: nestjs-open-redirect
  message: 'Untrusted user input in {url: ...} can result in Open Redirect vulnerability.'
  metadata:
    cwe:
    - 'CWE-601: URL Redirection to Untrusted Site (''Open Redirect'')'
    category: security
    technology:
    - nestjs
    owasp:
    - A01:2021 - Broken Access Control
    - A01:2025 - Broken Access Control
    references:
    - https://owasp.org/Top10/A01_2021-Broken_Access_Control
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
  languages:
  - typescript
  severity: WARNING
  patterns:
  - pattern: 'return {url: $URL}

      '
  - pattern-inside: "class $CN {\n    @Redirect(...)\n    $FN(...) {\n        ...\n\
      \    }\n}\n"
  - pattern-not: 'return {url: "..."}

      '
- id: define-styled-components-on-module-level
  patterns:
  - pattern-inside: 'import styled from ''styled-components'';

      ...

      '
  - pattern-either:
    - pattern-inside: "function $FUNC(...) {\n  ...\n}\n"
    - pattern-inside: "class $CLASS {\n  ...\n}\n"
  - pattern-either:
    - pattern: 'styled.$EL`...`;

        '
    - pattern: 'styled($EL)`...`;

        '
  message: By declaring a styled component inside the render method of a react component,
    you are dynamically creating a new component on every render. This means that
    React will have to discard and re-calculate that part of the DOM subtree on each
    subsequent render, instead of just calculating the difference of what changed
    between them. This leads to performance bottlenecks and unpredictable behavior.
  metadata:
    references:
    - https://styled-components.com/docs/faqs#why-should-i-avoid-declaring-styled-components-in-the-render-method
    category: best-practice
    technology:
    - react
  languages:
  - typescript
  - javascript
  severity: WARNING
- id: react-find-dom
  pattern-either:
  - pattern: 'findDOMNode(...)

      '
  - pattern: '$DOM.findDOMNode(...)

      '
  message: findDOMNode is an escape hatch used to access the underlying DOM node.
    In most cases, use of this escape hatch is discouraged because it pierces the
    component abstraction.
  metadata:
    references:
    - https://react.dev/reference/react-dom/findDOMNode
    - https://github.com/yannickcr/eslint-plugin-react/issues/678#issue-165177220
    category: best-practice
    technology:
    - react
  languages:
  - typescript
  - javascript
  severity: WARNING
- id: react-legacy-component
  patterns:
  - pattern: "$METHOD(...) {\n  ...\n}\n"
  - metavariable-regex:
      metavariable: $METHOD
      regex: componentWillMount|componentWillReceiveProps|componentWillUpdate
  message: Legacy component lifecycle was detected - $METHOD.
  languages:
  - typescript
  - javascript
  severity: WARNING
  metadata:
    category: best-practice
    technology:
    - react
- id: react-props-in-state
  pattern-either:
  - patterns:
    - pattern-inside: "class $CN extends React.Component {\n  ...\n}\n"
    - pattern-either:
      - pattern: 'state = {$NAME: <... this.props.$PROP ...>}

          '
      - pattern: 'this.state = {$NAME: <... this.props.$PROP ...>}

          '
    - metavariable-regex:
        metavariable: $NAME
        regex: ^(?!default|initial).*$
  - patterns:
    - pattern-either:
      - pattern-inside: "function $FN({$PROP},...) {\n  ...\n}\n"
      - pattern-inside: "function $FN($PROP,...) {\n  ...\n}\n"
    - pattern-either:
      - pattern: useState(<... $PROP ...>)
      - pattern: useState(<... $PROP.$KEY ...>)
      - pattern: "useState(function $X(...) {\n  ...\n  <... $PROP ...>\n  ...\n})\n"
      - pattern: "useState(function $X(...) {\n  ...\n  <... $PROP.$KEY ...>\n  ...\n\
          })\n"
    - metavariable-regex:
        metavariable: $PROP
        regex: ^(?!default|initial).*$
  message: Copying a prop into state in React -- this is bad practice as all updates
    to it are ignored. Instead, read props directly in your component and avoid copying
    props into state.
  metadata:
    references:
    - https://overreacted.io/writing-resilient-components/#principle-1-dont-stop-the-data-flow
    category: best-practice
    technology:
    - react
  languages:
  - typescript
  - javascript
  severity: WARNING
- id: react-props-spreading
  patterns:
  - pattern: <$X {...$PROPS} />
  - focus-metavariable: $PROPS
  message: It's best practice to explicitly pass props to an HTML component rather
    than use the spread operator. The spread operator risks passing invalid HTML props
    to an HTML element, which can cause console warnings or worse, give malicious
    actors a way to inject unexpected attributes.
  languages:
  - typescript
  - javascript
  severity: INFO
  metadata:
    source-rule-url: https://github.com/yannickcr/eslint-plugin-react/blob/master/docs/rules/jsx-props-no-spreading.md
    references:
    - https://github.com/yannickcr/eslint-plugin-react/blob/master/docs/rules/jsx-props-no-spreading.md
    category: best-practice
    technology:
    - react
- id: i18next-key-format
  patterns:
  - pattern-either:
    - patterns:
      - pattern-either:
        - pattern: t('$KEY')
        - pattern: t('$KEY', $OPTIONS)
        - pattern: t([$DYNAMIC_KEY, '$KEY'])
        - pattern: t([$DYNAMIC_KEY, '$KEY'], $OPTIONS)
      - metavariable-regex:
          metavariable: $KEY
          regex: (?!^[a-z0-9-]+\.[a-z0-9-]+\.[a-zA-Z0-9_.-]+$)
    - patterns:
      - pattern-either:
        - pattern: t([$DYNAMIC_KEY, '$KEY'])
        - pattern: t([$DYNAMIC_KEY, '$KEY'], $OPTIONS)
      - metavariable-regex:
          metavariable: $DYNAMIC_KEY
          regex: (?!^[`][a-z0-9-]+[.][a-z0-9-]+[.]\S+$)
    - patterns:
      - pattern-either:
        - pattern: $I18NEXT.t('$KEY')
        - pattern: $I18NEXT.t('$KEY', $OPTIONS)
        - pattern: $I18NEXT.t([$DYNAMIC_KEY, '$KEY'])
        - pattern: $I18NEXT.t([$DYNAMIC_KEY, '$KEY'], $OPTIONS)
      - metavariable-regex:
          metavariable: $I18NEXT
          regex: (^i18n|i18next$)
      - metavariable-regex:
          metavariable: $KEY
          regex: (?!^[a-z0-9-]+\.[a-z0-9-]+\.[a-zA-Z0-9_.-]+$)
    - patterns:
      - pattern-either:
        - pattern: $I18NEXT.t([$DYNAMIC_KEY, '$KEY'])
        - pattern: $I18NEXT.t([$DYNAMIC_KEY, '$KEY'], $OPTIONS)
      - metavariable-regex:
          metavariable: $I18NEXT
          regex: (^(i18n|i18next)$)
      - metavariable-regex:
          metavariable: $DYNAMIC_KEY
          regex: (?!^[`][a-z0-9-]+[.][a-z0-9-]+[.]\S+$)
  message: Translation key '$KEY' should match format 'MODULE.FEATURE.*'
  languages:
  - typescript
  - javascript
  severity: WARNING
  metadata:
    category: portability
    technology:
    - react
    - mui
    - i18next
    references:
    - https://www.notion.so/hendyirawan/Internationalization-Localization-Policy-318c21674e5f44c48d6f136a6eb2e024
    - https://mui.com/
    - https://react.i18next.com/
- id: jsx-label-not-i18n
  patterns:
  - pattern-either:
    - pattern: <TextField ... label="$MESSAGE" ... />
    - pattern: <Tab ... label="$MESSAGE" ... />
  - metavariable-regex:
      metavariable: $MESSAGE
      regex: (.*[a-zA-Z]+.*)
  - pattern-not: <$ELEMENT ... label="" ... />
  - pattern-not: <$ELEMENT ... label={t($KEY, ...)} ... />
  message: 'JSX Component label not internationalized: ''$MESSAGE'''
  languages:
  - typescript
  - javascript
  severity: WARNING
  metadata:
    category: portability
    technology:
    - react
    - mui
    - i18next
    references:
    - https://www.notion.so/hendyirawan/Internationalization-Localization-Policy-318c21674e5f44c48d6f136a6eb2e024
    - https://mui.com/
    - https://react.i18next.com/
- id: jsx-not-internationalized
  patterns:
  - pattern: <$ELEMENT>$MESSAGE</$ELEMENT>
  - metavariable-regex:
      metavariable: $MESSAGE
