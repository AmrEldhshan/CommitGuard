  patterns:
  - pattern: $CLIENT.chat.completions.create(...)
  - pattern-not: $CLIENT.chat.completions.create(..., max_tokens=$MT, ...)
- id: openai-missing-moderation
  languages:
  - python
  severity: WARNING
  message: OpenAI chat completion used without content moderation. Consider using
    the Moderations API (client.moderations.create()) to check user input for harmful
    content before sending to the model.
  metadata:
    cwe: 'CWE-77: Improper Neutralization of Special Elements used in a Command (''Command
      Injection'')'
    category: security
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
    technology:
    - openai
    references:
    - https://developers.openai.com/api/docs/guides/moderation
  patterns:
  - pattern: $CLIENT.chat.completions.create(...)
  - pattern-inside: "def $FUNC(...):\n    ...\n"
  - pattern-not-inside: "def $FUNC(...):\n    ...\n    $CLIENT.moderations.create(...)\n\
      \    ...\n"
- id: openai-missing-moderation-check
  languages:
  - python
  severity: WARNING
  message: OpenAI moderation response accessed without checking the 'flagged' field.
    Always check results[0].flagged before processing moderation categories to properly
    filter harmful content. See https://developers.openai.com/api/docs/guides/moderation
  metadata:
    cwe: 'CWE-252: Unchecked Return Value'
    category: security
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
    technology:
    - openai
    references:
    - https://developers.openai.com/api/docs/guides/moderation
  pattern-either:
  - patterns:
    - pattern: $RESP.results[0].categories
    - pattern-inside: "def $FUNC(...):\n    ...\n"
    - pattern-not-inside: "def $FUNC(...):\n    ...\n    if $RESP.results[0].flagged:\n\
        \        ...\n    ...\n"
    - pattern-not-inside: "def $FUNC(...):\n    ...\n    if $RESP.results[0].flagged\
        \ == True:\n        ...\n    ...\n"
  - patterns:
    - pattern: $RESP.results[0].category_scores
    - pattern-inside: "def $FUNC(...):\n    ...\n"
    - pattern-not-inside: "def $FUNC(...):\n    ...\n    if $RESP.results[0].flagged:\n\
        \        ...\n    ...\n"
    - pattern-not-inside: "def $FUNC(...):\n    ...\n    if $RESP.results[0].flagged\
        \ == True:\n        ...\n    ...\n"
- id: openai-missing-refusal-check-javascript
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: OpenAI response content accessed without checking for refusal. The model
    may refuse requests, and accessing .content without checking .refusal first may
    lead to unexpected behavior. Check response.choices[0].message.refusal before
    accessing content.
  metadata:
    cwe: 'CWE-252: Unchecked Return Value'
    category: security
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: HIGH
    technology:
    - openai
    references:
    - https://developers.openai.com/api/docs/guides/safety-best-practices/
  patterns:
  - pattern: $RESP.choices[0].message.content
  - pattern-not-inside: "if ($RESP.choices[0].message.refusal) {\n    ...\n} else\
      \ {\n    ...\n}\n"
  - pattern-not-inside: "if (!$RESP.choices[0].message.refusal) {\n    ...\n}\n"
- id: openai-missing-refusal-check-python
  languages:
  - python
  severity: WARNING
  message: OpenAI response content accessed without checking for refusal. The model
    may refuse requests, and accessing .content without checking .refusal first may
    lead to unexpected behavior. Check response.choices[0].message.refusal before
    accessing content.
  metadata:
    cwe: 'CWE-252: Unchecked Return Value'
    category: security
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: HIGH
    technology:
    - openai
    references:
    - https://developers.openai.com/api/docs/guides/safety-best-practices/
  patterns:
  - pattern: $RESP.choices[0].message.content
  - pattern-not-inside: "if $RESP.choices[0].message.refusal:\n    ...\nelse:\n  \
      \  ...\n"
  - pattern-not-inside: "if $RESP.choices[0].message.refusal is not None:\n    ...\n\
      else:\n    ...\n"
  - pattern-not-inside: "if not $RESP.choices[0].message.refusal:\n    ...\n"
- id: openai-missing-safety-identifier-javascript
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: OpenAI Responses API called without 'safety_identifier' parameter. Include
    a hashed user identifier to enable abuse monitoring and safety checks. See https://developers.openai.com/api/docs/guides/safety-checks
  metadata:
    cwe: 'CWE-778: Insufficient Logging'
    category: security
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: HIGH
    technology:
    - openai
    references:
    - https://developers.openai.com/api/docs/guides/safety-checks/
  patterns:
  - pattern: $CLIENT.responses.create({...})
  - pattern-not: '$CLIENT.responses.create({..., safety_identifier: $SID, ...})'
- id: openai-missing-safety-identifier-python
  languages:
  - python
  severity: WARNING
  message: OpenAI Responses API called without 'safety_identifier' parameter. Include
    a hashed user identifier to enable abuse monitoring and safety checks. See https://developers.openai.com/api/docs/guides/safety-checks
  metadata:
