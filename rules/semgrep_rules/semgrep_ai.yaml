        regex: ^sk-
  - patterns:
    - pattern: AsyncOpenAI(api_key="$KEY", ...)
    - metavariable-regex:
        metavariable: $KEY
        regex: ^sk-
- id: openai-hardcoded-api-key-ruby
  languages:
  - ruby
  severity: ERROR
  message: OpenAI API key is hardcoded in source code. Use environment variables or
