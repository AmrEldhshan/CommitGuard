rules:
- id: mcp-unsanitized-return-python
  mode: taint
  languages:
  - python
  severity: WARNING
  message: External HTTP response data flows directly into an MCP tool return value
    without sanitization. Untrusted API responses may contain prompt injection payloads
    or malicious content that could manipulate the LLM. Sanitize or validate external
    data before returning it from MCP tools.
  metadata:
    cwe: 'CWE-116: Improper Encoding or Escaping of Output'
    category: security
    confidence: MEDIUM
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    technology:
    - mcp
    references:
    - https://modelcontextprotocol.io/specification/draft/basic/security_best_practices
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: requests.get(...)
      - pattern: requests.post(...)
      - pattern: urllib.request.urlopen(...)
  pattern-sinks:
  - patterns:
    - pattern-inside: "@$SERVER.tool()\ndef $FUNC(...):\n    ...\n"
    - pattern: return $SINK
    - focus-metavariable: $SINK
  pattern-sanitizers:
  - pattern: sanitize(...)
  - pattern: bleach.clean(...)
  - pattern: html.escape(...)
  - pattern: str.strip(...)
- id: mistral-hardcoded-api-key-javascript
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: Mistral API key is hardcoded in source code. Use environment variables
    or a secrets manager instead.
  metadata:
    cwe: 'CWE-798: Use of Hard-coded Credentials'
    category: security
    subcategory:
    - vuln
    likelihood: HIGH
    impact: MEDIUM
    confidence: HIGH
    technology:
    - mistral
    references:
    - https://docs.mistral.ai/getting-started/quickstart/
  pattern: 'new Mistral({apiKey: "$KEY", ...})

    '
- id: mistral-hardcoded-api-key-python
  languages:
  - python
  severity: ERROR
  message: Mistral API key is hardcoded in source code. Use environment variables
    or a secrets manager instead.
  metadata:
    cwe: 'CWE-798: Use of Hard-coded Credentials'
    category: security
    subcategory:
    - vuln
    likelihood: HIGH
    impact: MEDIUM
    confidence: HIGH
    technology:
    - mistral
    references:
    - https://docs.mistral.ai/getting-started/quickstart/
  pattern-either:
  - pattern: Mistral(api_key="$KEY", ...)
  - pattern: MistralClient(api_key="$KEY", ...)
- id: mistral-missing-moderation
  languages:
  - python
  severity: WARNING
  message: Mistral chat completion used without content moderation. Consider using
    the Moderation API (client.classifiers.moderate() or client.classifiers.moderate_chat())
    to check content for harmful material. See https://docs.mistral.ai/capabilities/guardrailing/
  metadata:
    cwe: 'CWE-1188: Initialization with an Insecure Default'
    category: security
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
    technology:
    - mistral
    references:
    - https://docs.mistral.ai/capabilities/guardrailing/
  patterns:
  - pattern: $CLIENT.chat.complete(...)
  - pattern-inside: "def $FUNC(...):\n    ...\n"
  - pattern-not-inside: "def $FUNC(...):\n    ...\n    $CLIENT.classifiers.moderate(...)\n\
      \    ...\n"
  - pattern-not-inside: "def $FUNC(...):\n    ...\n    $CLIENT.classifiers.moderate_chat(...)\n\
      \    ...\n"
- id: mistral-missing-safe-prompt-javascript
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: Mistral chat completion called without 'safe_prompt' parameter. Setting
    safePrompt=true enables Mistral's built-in safety guardrailing. See https://docs.mistral.ai/capabilities/guardrailing/
  metadata:
    cwe: 'CWE-1188: Initialization with an Insecure Default'
    category: security
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: HIGH
    technology:
    - mistral
    references:
    - https://docs.mistral.ai/capabilities/guardrailing/
  patterns:
  - pattern: $CLIENT.chat.complete({...})
  - pattern-not: '$CLIENT.chat.complete({..., safePrompt: $SP, ...})'
- id: mistral-missing-safe-prompt-python
  languages:
  - python
  severity: WARNING
  message: Mistral chat completion called without 'safe_prompt' parameter. Setting
    safe_prompt=True enables Mistral's built-in safety guardrailing. See https://docs.mistral.ai/capabilities/guardrailing/
  metadata:
    cwe: 'CWE-1188: Initialization with an Insecure Default'
    category: security
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: HIGH
    technology:
    - mistral
    references:
    - https://docs.mistral.ai/capabilities/guardrailing/
  patterns:
  - pattern: $CLIENT.chat.complete(...)
  - pattern-not: $CLIENT.chat.complete(..., safe_prompt=$SP, ...)
- id: mistral-no-error-handling
  languages:
  - python
  severity: WARNING
  message: Mistral API call without error handling. Wrap API calls in try/except to
    handle rate limits, API errors, and network issues gracefully.
  metadata:
    cwe: 'CWE-754: Improper Check for Unusual or Exceptional Conditions'
    category: security
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
    technology:
    - mistral
    references:
    - https://docs.mistral.ai/capabilities/guardrailing/
  patterns:
  - pattern-either:
    - pattern: $CLIENT.chat.complete(...)
    - pattern: $CLIENT.chat.stream(...)
  - pattern-not-inside: "try:\n    ...\nexcept ...:\n    ...\n"
- id: mistral-user-input-in-system-prompt-js
  mode: taint
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: User input flows into the Mistral system prompt. This enables prompt injection
    attacks where users can override system instructions. Validate and sanitize user
    input, or move user input to the 'user' role message instead.
  metadata:
    cwe: 'CWE-77: Command Injection'
    category: security
    confidence: MEDIUM
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    technology:
    - mistral
    references:
    - https://docs.mistral.ai/capabilities/guardrailing/
  pattern-sources:
  - pattern: req.body.$F
  - pattern: req.query.$F
  - pattern: req.params.$F
  - pattern: req.body
  pattern-sinks:
  - patterns:
    - pattern: '{role: "system", content: $SINK}

        '
    - focus-metavariable: $SINK
- id: mistral-user-input-in-system-prompt-python
  mode: taint
  languages:
  - python
  severity: ERROR
  message: User input flows into the Mistral system prompt. This enables prompt injection
    attacks where users can override system instructions. Validate and sanitize user
    input, or move user input to the 'user' role message instead.
  metadata:
    cwe: 'CWE-77: Command Injection'
    category: security
    confidence: MEDIUM
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    technology:
    - mistral
    references:
    - https://docs.mistral.ai/capabilities/guardrailing/
  pattern-sources:
  - pattern: request.args.get(...)
  - pattern: request.form[...]
  - pattern: request.form.get(...)
  - pattern: request.json[...]
  - pattern: request.json.get(...)
  - pattern: request.data
  - pattern: request.GET[...]
  - pattern: request.GET.get(...)
  - pattern: request.POST[...]
  - pattern: request.POST.get(...)
  pattern-sinks:
  - patterns:
    - pattern: '{"role": "system", "content": $SINK}

        '
    - focus-metavariable: $SINK
- id: openai-hardcoded-api-key-go
  languages:
  - go
  severity: ERROR
  message: OpenAI API key is hardcoded in source code. Use environment variables or
    a secrets manager instead.
  metadata:
    cwe: 'CWE-798: Use of Hard-coded Credentials'
    category: security
    subcategory:
    - vuln
    likelihood: HIGH
    impact: MEDIUM
    confidence: HIGH
    technology:
    - openai
    references:
    - https://help.openai.com/en/articles/5112595-best-practices-for-api-key-safety
  patterns:
  - pattern: openai.NewClient("$KEY")
  - metavariable-regex:
      metavariable: $KEY
      regex: ^sk-
- id: openai-hardcoded-api-key-java
  languages:
  - java
  severity: ERROR
  message: OpenAI API key is hardcoded in source code. Use environment variables or
    a secrets manager instead.
  metadata:
    cwe: 'CWE-798: Use of Hard-coded Credentials'
    category: security
    subcategory:
    - vuln
    likelihood: HIGH
    impact: MEDIUM
    confidence: HIGH
