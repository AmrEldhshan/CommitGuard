  patterns:
  - pattern: 'new OpenAI({apiKey: "$KEY", ...})

      '
  - metavariable-regex:
      metavariable: $KEY
      regex: ^sk-
- id: openai-hardcoded-api-key-python
  languages:
  - python
  severity: ERROR
  message: OpenAI API key is hardcoded in source code. Use environment variables or
    a secrets manager instead.
  metadata:
    cwe: 'CWE-798: Use of Hard-coded Credentials'
    category: security
    subcategory:
    - vuln
    likelihood: HIGH
