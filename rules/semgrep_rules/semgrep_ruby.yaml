    - pattern: Rails.logger.$METHOD("...#{params.inspect}...")
    - pattern: "Rails.logger.$METHOD do\n  \"...#{params}...\"\nend\n"
    - pattern: "Rails.logger.$METHOD do\n  \"...#{params.inspect}...\"\nend\n"
