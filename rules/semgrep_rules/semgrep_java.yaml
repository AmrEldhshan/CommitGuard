rules:
- id: manifest-usesCleartextTraffic-true
  languages:
  - generic
  message: The Android manifest is configured to allow non-encrypted connections.
    Evaluate if this is necessary for your app, and disable it if appropriate. This
    flag is ignored on Android 7 (API 24) and above if a Network Security Config is
    present.
  metadata:
    category: best-practice
    technology:
    - android
    references:
    - https://developer.android.com/guide/topics/manifest/application-element#usesCleartextTraffic
    - https://developer.android.com/training/articles/security-config
  patterns:
  - pattern: 'android:usesCleartextTraffic="true"

      '
  - pattern-not-inside: '<!-- ... -->

      '
  severity: INFO
  paths:
    include:
    - '*.xml'
- id: manifest-usesCleartextTraffic-ignored-by-nsc
  languages:
  - generic
  message: Manifest uses both `android:usesCleartextTraffic` and Network Security
    Config. The `usesCleartextTraffic` directive is ignored on Android 7 (API 24)
    and above if a Network Security Config is present.
  metadata:
    category: best-practice
    technology:
    - android
    references:
    - https://developer.android.com/guide/topics/manifest/application-element#usesCleartextTraffic
    - https://developer.android.com/training/articles/security-config
  patterns:
  - pattern-either:
    - pattern: 'android:usesCleartextTraffic ... android:networkSecurityConfig

        '
    - pattern: 'android:networkSecurityConfig ... android:usesCleartextTraffic

        '
  - pattern-not-inside: '<!-- ... -->

      '
  severity: INFO
  paths:
    include:
    - '*.xml'
- id: nsc-allows-plaintext-traffic
  languages:
  - generic
  message: The Network Security Config is set to allow non-encrypted connections.
    Evaluate if this is necessary for your app, and disable it if appropriate. (To
    hide this warning, set `xmlns:tools="http://schemas.android.com/tools" tools:ignore="InsecureBaseConfiguration"`
    as parameters to your `<network-security-config>`)
  metadata:
    category: best-practice
    technology:
    - android
    references:
    - https://developer.android.com/training/articles/security-config
    - https://www.nowsecure.com/blog/2018/08/15/a-security-analysts-guide-to-network-security-configuration-in-android-p/
  patterns:
  - pattern: '<base-config ... cleartextTrafficPermitted="true" ... >

      '
  - pattern-not-inside: '<!-- ... -->

      '
  - pattern-not-inside: '<network-security-config ... InsecureBaseConfiguration ...
      >... ... ... ... ... ... ... ... ... ... </network-security-config>

      '
  severity: INFO
  paths:
    include:
    - '*.xml'
- id: nsc-pinning-without-backup
  languages:
  - generic
  message: Your app uses TLS public key pinning without specifying a backup key. If
    you are forced to change TLS keys or CAs on short notice, not having a backup
    pin can lead to connectivity issues until you can push out an update. It is considered
    best practice to add at least one additional pin as a backup.
  metadata:
    category: best-practice
    technology:
    - android
    references:
    - https://developer.android.com/training/articles/security-config#CertificatePinning
    - https://www.nowsecure.com/blog/2018/08/15/a-security-analysts-guide-to-network-security-configuration-in-android-p/
  patterns:
  - pattern: '<pin ...>...</pin>

      '
  - pattern-not-inside: '<pin ...>...</pin>...<pin ...>...</pin>

      '
  - pattern-inside: '<pin-set ...> ... ... </pin-set>

      '
  - pattern-inside: '<domain-config ... > ... ... ... ... ... </domain-config>

      '
  - pattern-not-inside: '<!-- ... -->

      '
  severity: INFO
  paths:
    include:
    - '*.xml'
- id: nsc-pinning-without-expiration
  languages:
  - generic
  message: Your app uses TLS public key pinning without specifying an expiration date.
    If your users do not update the app to receive new pins in time, expired or replaced
    certificates can lead to connectivity issues until they install an update. It
    is considered best practice to set an expiration time, after which the system
    will default to trusting system CAs and disregard the pin.
  metadata:
    category: best-practice
    technology:
    - android
    references:
    - https://developer.android.com/training/articles/security-config#CertificatePinning
    - https://www.nowsecure.com/blog/2018/08/15/a-security-analysts-guide-to-network-security-configuration-in-android-p/
  patterns:
  - pattern: '<pin-set ...>... ... ...</pin-set>

      '
  - pattern-not-inside: '<pin-set ... expiration="..."> ... ... ... </pin-set>

      '
  - pattern-inside: '<domain-config ... > ... ... ... ... ... </domain-config>

      '
  - pattern-not-inside: '<!-- ... -->

      '
  severity: INFO
  paths:
    include:
    - '*.xml'
- id: nsc-allows-user-ca-certs
  languages:
  - generic
  message: The Network Security Config is set to accept user-installed CAs. Evaluate
    if this is necessary for your app, and disable it if appropriate. (To hide this
    warning, set `xmlns:tools="http://schemas.android.com/tools" tools:ignore="AcceptsUserCertificates"`
    as parameters to your `<network-security-config>`)
  metadata:
    category: best-practice
    technology:
    - android
    references:
    - https://developer.android.com/training/articles/security-config
    - https://www.nowsecure.com/blog/2018/08/15/a-security-analysts-guide-to-network-security-configuration-in-android-p/
  patterns:
  - pattern: '<certificates ... user ... />

      '
  - pattern-inside: '<base-config ... > ... ... ... ... </base-config>

      '
  - pattern-not-inside: '<!-- ... -->

      '
  - pattern-not-inside: '<network-security-config ... AcceptsUserCertificates ...
      >... ... ... ... ... ... ... ... ... ... </network-security-config>

      '
  severity: WARNING
  paths:
    include:
    - '*.xml'
- id: nsc-allows-user-ca-certs-for-domain
  languages:
  - generic
  message: The Network Security Config is set to accept user-installed CAs for the
    domain `$DOMAIN`. Evaluate if this is necessary for your app, and disable it if
    appropriate. (To hide this warning, set `xmlns:tools="http://schemas.android.com/tools"
    tools:ignore="AcceptsUserCertificates"` as parameters to your `<network-security-config>`)
  metadata:
    category: best-practice
    technology:
    - android
    references:
    - https://developer.android.com/training/articles/security-config
    - https://www.nowsecure.com/blog/2018/08/15/a-security-analysts-guide-to-network-security-configuration-in-android-p/
  patterns:
  - pattern: '<certificates src="user" ... />

      '
  - pattern-inside: '<trust-anchors> ... ... ... </trust-anchors>

      '
  - pattern-inside: '<domain-config ... > ... <domain ...> $DOMAIN </domain>... ...
      ... </domain-config>

      '
  - pattern-not-inside: '<!-- ... -->

      '
  - pattern-not-inside: '<network-security-config ... AcceptsUserCertificates ...
      >... ... ... ... ... ... ... ... ... ... </network-security-config>

      '
  severity: WARNING
  paths:
    include:
    - '*.xml'
- id: exported_activity
  patterns:
  - pattern-not-inside: <activity ... android:exported="false" ... />
  - pattern-inside: "<activity  ... /> \n"
  - pattern-either:
    - pattern: '<activity ... android:exported="true" ... />

        '
    - pattern: '<activity ... <intent-filter> ... />

        '
  message: The application exports an activity. Any application on the device can
    launch the exported activity which may compromise the integrity of your application
    or its data.  Ensure that any exported activities do not have privileged access
    to your application's control plane.
  languages:
  - generic
  severity: WARNING
  paths:
    exclude:
    - sources/
    - classes3.dex
    - '*.so'
    include:
    - '*AndroidManifest.xml'
  metadata:
    category: security
    subcategory:
    - vuln
    cwe:
    - 'CWE-926: Improper Export of Android Application Components'
    confidence: MEDIUM
    likelihood: MEDIUM
    impact: MEDIUM
    owasp:
    - A5:2021 Security Misconfiguration
    technology:
    - Android
    references:
    - https://cwe.mitre.org/data/definitions/926.html
- id: tainted-sql-string
  languages:
  - java
  severity: ERROR
  message: Detected user input used to manually construct a SQL string. This is usually
    bad practice because manual construction could accidentally result in a SQL injection.
    An attacker could use a SQL injection to steal or modify contents of the database.
    Instead, use a parameterized query which is available by default in most database
    engines. Alternatively, consider using an object-relational mapper (ORM) such
    as Sequelize which will protect your queries.
  options:
    interfile: true
  metadata:
    references:
    - https://owasp.org/www-community/attacks/SQL_Injection
    category: security
    owasp:
    - A01:2017 - Injection
    - A03:2021 - Injection
    - A05:2025 - Injection
    cwe:
    - 'CWE-89: Improper Neutralization of Special Elements used in an SQL Command
      (''SQL Injection'')'
    technology:
    - aws-lambda
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    interfile: true
  mode: taint
  pattern-sources:
  - patterns:
    - focus-metavariable: $EVENT
    - pattern-either:
      - pattern: "$HANDLERTYPE $HANDLER($TYPE $EVENT, com.amazonaws.services.lambda.runtime.Context\
          \ $CONTEXT) {\n  ...\n}\n"
      - pattern: "$HANDLERTYPE $HANDLER(InputStream $EVENT, OutputStream $OUT, com.amazonaws.services.lambda.runtime.Context\
          \ $CONTEXT) {\n  ...\n}\n"
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: '"$SQLSTR" + ...

          '
      - pattern: '"$SQLSTR".concat(...)

          '
      - patterns:
        - pattern-inside: 'StringBuilder $SB = new StringBuilder("$SQLSTR");

            ...

            '
        - pattern: $SB.append(...)
      - patterns:
        - pattern-inside: '$VAR = "$SQLSTR";

            ...

            '
        - pattern: $VAR += ...
      - pattern: String.format("$SQLSTR", ...)
    - metavariable-regex:
        metavariable: $SQLSTR
        regex: (?i)(select|delete|insert|create|update|alter|drop)\b
    - pattern-not-inside: 'System.out.$PRINTLN(...)

        '
- id: tainted-sqli
  message: Detected SQL statement that is tainted by `$EVENT` object. This could lead
    to SQL injection if variables in the SQL statement are not properly sanitized.
    Use parameterized SQL queries or properly sanitize user input instead.
  languages:
  - java
  severity: WARNING
  mode: taint
  pattern-sources:
  - patterns:
    - focus-metavariable: $EVENT
    - pattern-either:
      - pattern: "$HANDLERTYPE $HANDLER($TYPE $EVENT, com.amazonaws.services.lambda.runtime.Context\
          \ $CONTEXT) {\n  ...\n}\n"
      - pattern: "$HANDLERTYPE $HANDLER(InputStream $EVENT, OutputStream $OUT, com.amazonaws.services.lambda.runtime.Context\
          \ $CONTEXT) {\n  ...\n}\n"
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: "(java.sql.CallableStatement $STMT) = ...; \n"
      - pattern: '(java.sql.Statement $STMT) = ...;

          '
      - pattern: '(java.sql.PreparedStatement $STMT) = ...;

          '
      - pattern: '$VAR = $CONN.prepareStatement(...)

          '
      - pattern: '$PATH.queryForObject(...);

          '
      - pattern: '(java.util.Map<String, Object> $STMT) = $PATH.queryForMap(...);

          '
      - pattern: '(org.springframework.jdbc.support.rowset.SqlRowSet $STMT) = ...;

          '
      - patterns:
        - pattern-inside: '(String $SQL) = "$SQLSTR" + ...;

            ...

            '
        - pattern: $PATH.$SQLCMD(..., $SQL, ...);
        - metavariable-regex:
            metavariable: $SQLSTR
            regex: (?i)(^SELECT.* | ^INSERT.* | ^UPDATE.*)
        - metavariable-regex:
            metavariable: $SQLCMD
            regex: (execute|query|executeUpdate|batchUpdate)
  options:
    interfile: true
  metadata:
    category: security
    technology:
    - sql
    - java
    - aws-lambda
    cwe:
    - 'CWE-89: Improper Neutralization of Special Elements used in an SQL Command
      (''SQL Injection'')'
    owasp:
    - A01:2017 - Injection
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: HIGH
    confidence: MEDIUM
    interfile: true
- id: java-jwt-hardcoded-secret
  message: A hard-coded credential was detected. It is not recommended to store credentials
    in source-code, as this risks secrets being leaked and used by either an internal
    or external malicious adversary. It is recommended to use environment variables
    to securely provide credentials or retrieve credentials from a secure vault or
    HSM (Hardware Security Module).
  metadata:
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    technology:
    - java
    - secrets
    - jwt
    category: security
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: LOW
    impact: MEDIUM
    confidence: HIGH
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern-either:
    - pattern: '(Algorithm $ALG) = $ALGO.$HMAC("$Y");

        '
    - pattern: '$SECRET = "$Y";

        ...

        (Algorithm $ALG) = $ALGO.$HMAC($SECRET);

        '
    - pattern: "class $CLASS {\n  ...\n  $TYPE $SECRET = \"$Y\";\n  ...\n  $RETURNTYPE\
        \ $FUNC (...) {\n    ...\n    (Algorithm $ALG) = $ALGO.$HMAC($SECRET);\n \
        \   ...\n  }\n  ...\n}\n"
  - focus-metavariable: $Y
  - metavariable-regex:
      metavariable: $HMAC
      regex: (HMAC384|HMAC256|HMAC512)
- id: java-jwt-none-alg
  message: Detected use of the 'none' algorithm in a JWT token. The 'none' algorithm
    assumes the integrity of the token has already been verified. This would allow
    a malicious actor to forge a JWT token that will automatically be verified. Do
    not explicitly use the 'none' algorithm. Instead, use an algorithm such as 'HS256'.
  metadata:
    cwe:
    - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A02:2021 - Cryptographic Failures
    - A04:2025 - Cryptographic Failures
    source-rule-url: https://semgrep.dev/blog/2020/hardcoded-secrets-unverified-tokens-and-other-common-jwt-mistakes/
    category: security
    technology:
    - jwt
    confidence: HIGH
    references:
    - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
    subcategory:
    - vuln
    likelihood: HIGH
    impact: MEDIUM
  languages:
  - java
  severity: ERROR
  pattern-either:
  - pattern: '$JWT.sign(com.auth0.jwt.algorithms.Algorithm.none());

      '
  - pattern: '$NONE = com.auth0.jwt.algorithms.Algorithm.none();

      ...

      $JWT.sign($NONE);

      '
  - pattern: "class $CLASS {\n  ...\n  $TYPE $NONE = com.auth0.jwt.algorithms.Algorithm.none();\n\
      \  ...\n  $RETURNTYPE $FUNC (...) {\n    ...\n    $JWT.sign($NONE);\n    ...\n\
      \  }\n  ...\n}"
- id: java-jwt-decode-without-verify
  message: Detected the decoding of a JWT token without a verify step. JWT tokens
    must be verified before use, otherwise the token's integrity is unknown. This
    means a malicious actor could forge a JWT token with any claims. Call '.verify()'
    before using the token.
  metadata:
    cwe:
    - 'CWE-345: Insufficient Verification of Data Authenticity'
    owasp:
    - A08:2021 - Software and Data Integrity Failures
    - A08:2025 - Software or Data Integrity Failures
    source-rule-url: https://semgrep.dev/blog/2020/hardcoded-secrets-unverified-tokens-and-other-common-jwt-mistakes/
    category: security
    technology:
    - jwt
    confidence: MEDIUM
    references:
    - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures
    subcategory:
    - vuln
    likelihood: LOW
    impact: HIGH
  languages:
  - java
  severity: WARNING
  patterns:
  - pattern: 'com.auth0.jwt.JWT.decode(...);

      '
  - pattern-not-inside: "class $CLASS {\n  ...\n  $RETURNTYPE $FUNC (...) {\n    ...\n\
      \    $VERIFIER.verify(...);\n    ...\n  }\n}"
- id: insecure-resteasy-deserialization
  message: When a Restful webservice endpoint is configured to use wildcard mediaType
    {*/*} as a value for the @Consumes annotation, an attacker could abuse the SerializableProvider
    by sending a HTTP Request with a Content-Type of application/x-java-serialized-object.
    The body of that request would be processed by the SerializationProvider and could
    contain a malicious payload, which may lead to arbitrary code execution when calling
    the $Y.getObject method.
  severity: WARNING
  metadata:
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
    category: security
    cwe:
    - 'CWE-502: Deserialization of Untrusted Data'
    cwe2021-top25: true
    cwe2022-top25: true
    owasp:
    - A08:2017 - Insecure Deserialization
    - A08:2021 - Software and Data Integrity Failures
    - A08:2025 - Software or Data Integrity Failures
    references:
    - https://access.redhat.com/blogs/766093/posts/3162112
    subcategory:
    - audit
    technology:
    - jax-rs
  languages:
  - java
  pattern-either:
  - pattern: '@Consumes({"application/x-java-serialized-object"})

      '
  - pattern: '@Consumes({"*/*"})

      '
  - pattern: '@Consumes("*/*")

      '
  - pattern: '@Consumes({MediaType.WILDCARD_TYPE})

      '
- id: default-resteasy-provider-abuse
  message: When a Restful webservice endpoint isn't configured with a @Consumes annotation,
    an attacker could abuse the SerializableProvider by sending a HTTP Request with
    a Content-Type of application/x-java-serialized-object. The body of that request
    would be processed by the SerializationProvider and could contain a malicious
    payload, which may lead to arbitrary code execution. Instead, add a @Consumes
    annotation to the function or class.
  severity: WARNING
  metadata:
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
    category: security
    cwe:
    - 'CWE-502: Deserialization of Untrusted Data'
    cwe2021-top25: true
    cwe2022-top25: true
    owasp:
    - A08:2017 - Insecure Deserialization
    - A08:2021 - Software and Data Integrity Failures
    - A08:2025 - Software or Data Integrity Failures
    references:
    - https://access.redhat.com/blogs/766093/posts/3162112
    subcategory:
    - audit
    technology:
    - jax-rs
  languages:
  - java
  patterns:
  - pattern: '@Path("...")

      public $RETURNTYPE $METHOD(...) { ...}

      '
  - pattern-not-inside: '@GET

      public $RETURNTYPE $METHOD(...) { ...}

      '
  - pattern-not-inside: '@Path("...")

      @Consumes(...)

      public $RETURNTYPE $METHOD(...) { ...}

      '
  - pattern-not-inside: '@Consumes(...)

      public class $CLASSNAME { ... }

      '
- id: jax-rs-path-traversal
  metadata:
    owasp:
    - A05:2017 - Broken Access Control
    - A01:2021 - Broken Access Control
    - A01:2025 - Broken Access Control
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path
      Traversal'')'
    source-rule-url: https://find-sec-bugs.github.io/bugs.htm#PATH_TRAVERSAL_IN
    references:
    - https://www.owasp.org/index.php/Path_Traversal
    category: security
    technology:
    - jax-rs
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: LOW
    impact: LOW
    confidence: MEDIUM
  message: Detected a potential path traversal. A malicious actor could control the
    location of this file, to include going backwards in the directory with '../'.
    To address this, ensure that user-controlled variables in file paths are sanitized.
    You may also consider using a utility method such as org.apache.commons.io.FilenameUtils.getName(...)
    to only retrieve the file name from the path.
  severity: WARNING
  languages:
  - java
  pattern-either:
  - pattern: "$RETURNTYPE $FUNC (..., @PathParam(...) $TYPE $VAR, ...) {\n  ...\n\
      \  new File(..., $VAR, ...);\n  ...\n}\n"
  - pattern: "$RETURNTYPE $FUNC (..., @javax.ws.rs.PathParam(...) $TYPE $VAR, ...)\
      \ {\n  ...\n  new File(..., $VAR, ...);\n  ...\n}"
- id: seam-log-injection
  patterns:
  - pattern: '$LOG.$INFO($X + $Y,...)

      '
  - pattern-either:
    - pattern-inside: 'import org.jboss.seam.log.Log;

        ...

        '
    - pattern-inside: 'org.jboss.seam.log.Log $LOG = ...;

        ...

        '
  - metavariable-regex:
      metavariable: $INFO
      regex: (debug|error|fatal|info|trace|warn)
  languages:
  - java
  message: Seam Logging API support an expression language to introduce bean property
    to log messages. The expression language can also be the source to unwanted code
    execution. In this context, an expression is built with a dynamic value. The source
    of the value(s) should be verified to avoid that unfiltered values fall into this
    risky code evaluation.
  metadata:
    cwe:
    - 'CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code
      (''Eval Injection'')'
    owasp:
    - A03:2021 - Injection
    - A05:2025 - Injection
    source-rule-url: https://find-sec-bugs.github.io/bugs.htm#SEAM_LOG_INJECTION
    category: security
    technology:
    - jboss
    confidence: LOW
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
  severity: ERROR
- id: find-sql-string-concatenation
  message: In $METHOD, $X is used to construct a SQL query via string concatenation.
  languages:
  - java
  severity: ERROR
  pattern-either:
  - pattern: "$RETURN $METHOD(...,String $X,...){\n  ...\n  Session $SESSION = ...;\n\
      \  ...\n  String $QUERY = ... + $X + ...;\n  ...\n  PreparedStatement $PS =\
      \ $SESSION.connection().prepareStatement($QUERY);\n  ...\n  ResultSet $RESULT\
      \ = $PS.executeQuery();\n  ...\n}\n"
  - pattern: "$RETURN $METHOD(...,String $X,...){\n  ...\n  String $QUERY = ... +\
      \ $X + ...;\n  ...\n  Session $SESSION = ...;\n  ...\n  PreparedStatement $PS\
      \ = $SESSION.connection().prepareStatement($QUERY);\n  ...\n  ResultSet $RESULT\
      \ = $PS.executeQuery();\n  ...\n}\n"
  metadata:
    category: security
    technology:
    - jboss
    confidence: MEDIUM
    cwe:
    - 'CWE-89: Improper Neutralization of Special Elements used in an SQL Command
      (''SQL Injection'')'
    owasp:
    - A01:2017 - Injection
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: LOW
    impact: HIGH
- id: jjwt-none-alg
  message: Detected use of the 'none' algorithm in a JWT token. The 'none' algorithm
    assumes the integrity of the token has already been verified. This would allow
    a malicious actor to forge a JWT token that will automatically be verified. Do
    not explicitly use the 'none' algorithm. Instead, use an algorithm such as 'HS256'.
  metadata:
    cwe:
    - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A02:2021 - Cryptographic Failures
    - A04:2025 - Cryptographic Failures
    source-rule-url: https://semgrep.dev/blog/2020/hardcoded-secrets-unverified-tokens-and-other-common-jwt-mistakes/
    asvs:
      section: 'V3: Session Management Verification Requirements'
      control_id: 3.5.3 Insecue Stateless Session Tokens
      control_url: https://github.com/OWASP/ASVS/blob/master/4.0/en/0x12-V3-Session-management.md#v35-token-based-session-management
